<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">RNAseq-Analysis</title>
  <desc id="d">Bulk total-RNA-seq pipelines: from paired-end reads to UMI-deduplicated gene counts and differential expression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="0.55" stop-color="#0f3550"/>
      <stop offset="1" stop-color="#114a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>

  <!-- double helix, right side -->
  <g transform="translate(850,36) scale(0.8)" stroke-linecap="round">
    <path d="M0 130 C40 40, 80 40, 120 130 S200 220, 240 130 S320 40, 360 130 S440 220, 480 130" fill="none" stroke="#4fd1c5" stroke-opacity="0.6" stroke-width="3.5"/>
    <path d="M0 130 C40 220, 80 220, 120 130 S200 40, 240 130 S320 220, 360 130 S440 40, 480 130" fill="none" stroke="#7aa7ff" stroke-opacity="0.6" stroke-width="3.5"/>
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5">
      <line x1="30" y1="82" x2="30" y2="178"/><line x1="60" y1="63" x2="60" y2="197"/><line x1="90" y1="82" x2="90" y2="178"/><line x1="150" y1="82" x2="150" y2="178"/><line x1="180" y1="63" x2="180" y2="197"/><line x1="210" y1="82" x2="210" y2="178"/><line x1="270" y1="82" x2="270" y2="178"/><line x1="300" y1="63" x2="300" y2="197"/><line x1="330" y1="82" x2="330" y2="178"/><line x1="390" y1="82" x2="390" y2="178"/><line x1="420" y1="63" x2="420" y2="197"/><line x1="450" y1="82" x2="450" y2="178"/>
    </g>
  </g>

  <!-- paired-end reads motif -->
  <g transform="translate(64,58)" stroke-linecap="round" stroke-width="6">
    <line x1="0" y1="0" x2="54" y2="0" stroke="#4fd1c5"/><line x1="86" y1="0" x2="140" y2="0" stroke="#7aa7ff"/>
    <line x1="22" y1="14" x2="76" y2="14" stroke="#4fd1c5" stroke-opacity="0.7"/><line x1="118" y1="14" x2="172" y2="14" stroke="#7aa7ff" stroke-opacity="0.7"/>
    <line x1="8" y1="28" x2="62" y2="28" stroke="#4fd1c5" stroke-opacity="0.45"/><line x1="100" y1="28" x2="154" y2="28" stroke="#7aa7ff" stroke-opacity="0.45"/>
  </g>

  <text x="64" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">RNAseq-Analysis</text>
  <rect x="66" y="176" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="218" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#cfe3f0">Bulk total-RNA-seq pipelines, from reads to biology</text>

  <!-- pipeline chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(64,250)">
      <rect width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#4fd1c5" stroke-opacity="0.6"/>
      <text x="65" y="22" text-anchor="middle" fill="#e6f6f4">FASTQ + UMI</text>
    </g>
    <text x="206" y="273" fill="#7aa7ff" font-size="18">→</text>
    <g transform="translate(230,250)">
      <rect width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#4fd1c5" stroke-opacity="0.6"/>
      <text x="46" y="22" text-anchor="middle" fill="#e6f6f4">STAR</text>
    </g>
    <text x="334" y="273" fill="#7aa7ff" font-size="18">→</text>
    <g transform="translate(358,250)">
      <rect width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#6fbef0" stroke-opacity="0.6"/>
      <text x="69" y="22" text-anchor="middle" fill="#e6f6f4">UMI dedup</text>
    </g>
    <text x="508" y="273" fill="#7aa7ff" font-size="18">→</text>
    <g transform="translate(532,250)">
      <rect width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7aa7ff" stroke-opacity="0.6"/>
      <text x="69" y="22" text-anchor="middle" fill="#e6f6f4">featureCounts</text>
    </g>
    <text x="682" y="273" fill="#7aa7ff" font-size="18">→</text>
    <g transform="translate(706,250)">
      <rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7aa7ff" stroke-opacity="0.6"/>
      <text x="52" y="22" text-anchor="middle" fill="#e6f6f4">DESeq2</text>
    </g>
  </g>

  <text x="1216" y="312" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#9fbfd3">nf-core/rnaseq 3.26.0 · GRCm39 · SMARTer Pico v3</text>
</svg>
